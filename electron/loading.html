<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes I.R</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        background: #0f1117;
        color: #e8eaf0;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #0f1117;
      }

      main { text-align: center; padding: 32px; }
      .brand-logo {
        display: none;
        width: 150px;
        height: 150px;
        object-fit: contain;
        margin: 0 auto 16px;
      }
      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border: 3px solid #2b303b;
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .mark::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f97316;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 8px 0 0;
        color: #8b909e;
        font-size: 13px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <img class="brand-logo" src="./logo.png" alt="Clientes I.R" onload="this.style.display='block'; document.querySelector('.mark').style.display='none'" />
      <div class="mark" aria-hidden="true"></div>
      <h1>Clientes I.R</h1>
      <p>Conectando con el sistema...</p>
    </main>
  </body>
</html>
